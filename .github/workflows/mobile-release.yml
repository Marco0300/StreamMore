name: Streammore Mobile Release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish signed mobile APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/mobile/streammore-mobile-release.keystore

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMMORE_MOBILE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing STREAMMORE_MOBILE_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Run unit test suite
        working-directory: mobile
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build signed release
        working-directory: mobile
        env:
          STREAMMORE_RELEASE_KEYSTORE: ${{ env.KEYSTORE_PATH }}
          STREAMMORE_RELEASE_STORE_PASSWORD: ${{ secrets.STREAMMORE_MOBILE_STORE_PASSWORD }}
          STREAMMORE_RELEASE_KEY_PASSWORD: ${{ secrets.STREAMMORE_MOBILE_KEY_PASSWORD }}
        run: |
          test -n "$STREAMMORE_RELEASE_STORE_PASSWORD" || { echo 'Missing STREAMMORE_MOBILE_STORE_PASSWORD'; exit 1; }
          test -n "$STREAMMORE_RELEASE_KEY_PASSWORD" || { echo 'Missing STREAMMORE_MOBILE_KEY_PASSWORD'; exit 1; }
          ./gradlew assembleRelease lintRelease --no-daemon

      - name: Verify version, signer, and digest
        id: artifact
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" || { echo 'Android SDK location is unknown'; exit 1; }
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$aapt" || { echo "aapt not found under $sdk/build-tools"; exit 1; }
          test -x "$apksigner" || { echo "apksigner not found under $sdk/build-tools"; exit 1; }
          tag_version="${TAG_NAME#mobile-v}"
          apk='mobile/app/build/outputs/apk/release/app-release.apk'
          test -f "$apk" || { echo "Release APK is missing: $apk"; exit 1; }
          apk_version="$("$aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$apk_version" || { echo 'Could not read versionName from the APK'; exit 1; }
          if [ "$tag_version" != "$apk_version" ]; then
            echo "Tag version $tag_version does not match APK version $apk_version"
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"
          asset="mobile/Streammore-Mobile-${apk_version}-release.apk"
          cp "$apk" "$asset"
          digest="$(sha256sum "$asset" | awk '{print $1}')"
          printf 'TAG_VERSION=%s\n' "$apk_version" >> "$GITHUB_ENV"
          printf 'ASSET_PATH=%s\n' "$asset" >> "$GITHUB_ENV"
          printf 'SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'SHA-256: %s\n' "$digest" > mobile/release-digest.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Streammore Mobile v${{ env.TAG_VERSION }}
          generate_release_notes: true
          body: |
            Streammore Mobile v${{ env.TAG_VERSION }}

            SHA-256: `${{ env.SHA256 }}`
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
