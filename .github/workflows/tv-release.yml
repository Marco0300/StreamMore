name: Streammore TV Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish signed TV APK
    runs-on: ubuntu-latest
    env:
      # The TV project is the repository root; mobile/ is a sibling directory and
      # is not part of this Gradle build (settings.gradle.kts includes only :app).
      KEYSTORE_PATH: ${{ github.workspace }}/streammore-release.keystore
      # The certificate the installed app already carries. An APK signed with any
      # other key cannot install over it, so the build fails rather than publish.
      EXPECTED_SIGNER_SHA256: 8a4c7dbc400d44d0726937b076cd1a6ce7f5d425a55309bee1273764afb2c4a4

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 21
        # 21, not 17: the suite is green on 21. On 17 the player screenshot test
        # dies in Robolectric, because JDK 17 resolves every method signature of
        # android.bluetooth.BluetoothDevice eagerly (reflection only became lazy in
        # JDK 18) and Robolectric's API 34 android-all jar has no
        # BluetoothDevice$BluetoothAddress for Media3's Spatializer path to resolve.
        # The APK still compiles to Java 17 bytecode (see sourceCompatibility).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode the TV release keystore
        # The TV keystore is its own secret: never the phone client's, whose key
        # would produce an APK that cannot upgrade an installed TV.
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMMORE_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing STREAMMORE_TV_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Run unit test suite
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build signed release
        env:
          STREAMMORE_RELEASE_KEYSTORE: ${{ env.KEYSTORE_PATH }}
          STREAMMORE_RELEASE_STORE_PASSWORD: ${{ secrets.STREAMMORE_TV_STORE_PASSWORD }}
          STREAMMORE_RELEASE_KEY_PASSWORD: ${{ secrets.STREAMMORE_TV_KEY_PASSWORD }}
        run: |
          test -n "$STREAMMORE_RELEASE_STORE_PASSWORD" || { echo 'Missing STREAMMORE_TV_STORE_PASSWORD'; exit 1; }
          test -n "$STREAMMORE_RELEASE_KEY_PASSWORD" || { echo 'Missing STREAMMORE_TV_KEY_PASSWORD'; exit 1; }
          ./gradlew assembleRelease lintRelease --no-daemon

      - name: Verify version, signer, and digest
        id: artifact
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" || { echo 'Android SDK location is unknown'; exit 1; }
          # Prefer the build-tools this workflow installs. A runner image can carry a
          # newer set, and 'sort -V | tail -1' then verifies with tools nobody pinned.
          if [ -d "$sdk/build-tools/35.0.0" ]; then
            tools="$sdk/build-tools/35.0.0"
          else
            tools="$(find "$sdk/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          fi
          aapt="$tools/aapt"
          apksigner="$tools/apksigner"
          test -x "$aapt" || { echo "aapt not found under $tools"; exit 1; }
          test -x "$apksigner" || { echo "apksigner not found under $tools"; exit 1; }
          echo "verifying with: $tools"
          tag_version="${TAG_NAME#v}"
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk" || { echo "Release APK is missing: $apk"; exit 1; }
          apk_version="$("$aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$apk_version" || { echo 'Could not read versionName from the APK'; exit 1; }
          if [ "$tag_version" != "$apk_version" ]; then
            echo "Tag version $tag_version does not match APK version $apk_version"
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"
          # Read the fingerprint by shape, not by label: apksigner's wording has moved
          # between build-tools versions, and an unmatched label used to look exactly
          # like a wrong signer.
          certs="$("$apksigner" verify --print-certs "$apk")"
          signer="$(printf '%s\n' "$certs" | grep -i 'sha-256' | grep -oiE '[0-9a-f]{64}' | head -1 | tr 'A-Z' 'a-z')"
          test -n "$signer" || { echo 'No SHA-256 fingerprint in apksigner --print-certs output'; exit 1; }
          if [ "$signer" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo 'Signer does not match the key the installed app was signed with,'
            echo 'so this APK would not install over it. Signing details are withheld from logs.'
            exit 1
          fi
          asset="Streammore-TV-v${apk_version}-release.apk"
          cp "$apk" "$asset"
          digest="$(sha256sum "$asset" | awk '{print $1}')"
          printf 'TAG_VERSION=%s\n' "$apk_version" >> "$GITHUB_ENV"
          printf 'ASSET_PATH=%s\n' "$asset" >> "$GITHUB_ENV"
          printf 'SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'SHA-256: %s\n' "$digest" > release-digest.txt
          printf 'digest=%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf '## Streammore TV v%s\n\n- SHA-256: `%s`\n' \
            "$apk_version" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Streammore TV v${{ env.TAG_VERSION }}
          generate_release_notes: false
          body: |
            ## Streammore TV v${{ env.TAG_VERSION }} — Release Notes

            - Removed unnecessary Home-screen recomposition when moving up or down the sidebar, reducing navigation hitches during trailer playback.
            - Preserved focused menu labels, return-to-menu position, and the purple content-card focus outline.

            SHA-256: `${{ env.SHA256 }}`

            The TV updater selects the newest release carrying a `Streammore-TV-*.apk` asset.
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true

      - name: Keep the test reports when the gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
